version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root123}
      MYSQL_DATABASE: ${DB_NAME:-blog}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: blog-server
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-blog}
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-root123}
      - JWT_SECRET=${JWT_SECRET:-your-production-jwt-secret-key}
      - FRONTEND_DOMAIN=${FRONTEND_DOMAIN:-https://your-domain.com}
      - BACKEND_DOMAIN=${BACKEND_DOMAIN:-https://api.your-domain.com}
    volumes:
      - uploads:/app/src/uploads
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "npm start"

  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/.output/public:/usr/share/nginx/html:ro
      - uploads:/usr/share/nginx/uploads:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
    command: >
      sh -c "nginx -g 'daemon off;'"

volumes:
  mysql-data:
  uploads: