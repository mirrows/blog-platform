# Nginx Configuration for Blog Platform
# 部署时将此文件放置在项目根目录

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    # 限制上传大小（与后端配置一致）
    client_max_body_size 10m;

    # ============================================
    # HTTP -> HTTPS 重定向（启用SSL后取消注释）
    # ============================================
    # server {
    #     listen 80;
    #     server_name your-domain.com api.your-domain.com;
    #     return 301 https://$server_name$request_uri;
    # }

    # ============================================
    # 前端静态资源服务
    # ============================================
    server {
        listen 80;
        # listen 443 ssl http2;  # 启用SSL后使用
        server_name your-domain.com;  # 替换为你的域名

        # SSL 配置（启用SSL后取消注释）
        # ssl_certificate /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        # ssl_prefer_server_ciphers on;

        # 前端静态文件（Nuxt 3 SSG 输出目录）
        root /usr/share/nginx/html;
        index index.html;

        # Gzip 静态资源
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # SPA 路由重写（所有非文件请求指向 index.html）
        location / {
            try_files $uri $uri/ /index.html;
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
            add_header X-XSS-Protection "1; mode=block";
        }

        # 上传文件访问（通过 koa-static 也可访问）
        location /uploads/ {
            proxy_pass http://server:3000/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # ============================================
    # 后端 API 反向代理
    # ============================================
    server {
        listen 80;
        # listen 443 ssl http2;  # 启用SSL后使用
        server_name api.your-domain.com;  # 替换为你的API域名

        # SSL 配置（启用SSL后取消注释）
        # ssl_certificate /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        # ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://server:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持（如需）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 请求限制
        limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
        limit_req zone=api burst=50 nodelay;
    }
}
