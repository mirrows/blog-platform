version: '3.8'

services:
  # ============================================
  # MySQL 数据库
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root123}
      MYSQL_DATABASE: ${DB_NAME:-blog}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      MYSQL_INITDB_SKIP_TZINFO: 1
    command: [
      'mysqld',
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--skip-character-set-client-handshake'
    ]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    # ports:          # 注释掉，容器间内部通信不需要暴露端口
    #   - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # 前端构建（编译 Nuxt 为静态文件）
  # 构建完成后将静态文件复制到共享卷，供 Nginx 使用
  # ============================================
  client-builder:
    build:
      context: .
      dockerfile: Dockerfile.client
      target: builder
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8076}
    container_name: blog-client-builder
    volumes:
      - client-dist:/output
    # 将构建产物复制到共享卷，然后退出
    command: >
      sh -c "cp -r /app/.output/public/* /output/ && echo '前端构建完成'"
    restart: "no"
    # 不需要依赖数据库，可以提前构建

  # ============================================
  # 后端 API 服务（Koa + Sequelize）
  # ============================================
  server:
    build: ./server
    container_name: blog-server
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-blog}
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-root123}
      - JWT_SECRET=${JWT_SECRET:-your-production-jwt-secret-key}
      - FRONTEND_DOMAIN=${FRONTEND_DOMAIN:-http://localhost}
      - BACKEND_DOMAIN=${BACKEND_DOMAIN:-http://localhost:5000}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
    volumes:
      - ./server/uploads:/app/src/uploads
    ports:
      - "5000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  # ============================================
  # Nginx 反向代理（提供前端静态文件 + API 代理）
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    restart: always
    ports:
      - "8076:80"
      - "8686:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
      - client-dist:/usr/share/nginx/html:ro
      - ./server/uploads:/usr/share/nginx/uploads:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - client-builder
      - server

volumes:
  mysql-data:
  client-dist:
